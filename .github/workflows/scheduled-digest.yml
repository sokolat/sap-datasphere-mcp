name: Scheduled task-chain digest

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --no-cache-dir requests

      - name: Invoke agent
        env:
          AGENT_URL: ${{ secrets.AGENT_URL }}
          AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
          CHAIN_SPACE: ${{ vars.CHAIN_SPACE }}
          CHAIN_NAMES: ${{ vars.CHAIN_NAMES }}
          CHAIN_PROMPT_TEMPLATE: ${{ vars.CHAIN_PROMPT_TEMPLATE }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: python scripts/scheduled_digest.py
